[package]
name = "speakeasy-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "ai-speakeasy-mini"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
# Session identifiers. Already pinned at the workspace root and already in
# `dependency-policy/build-scripts.json`, so this adds no crate to the graph.
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
speakeasy-domain.workspace = true
speakeasy-audio.workspace = true
speakeasy-worker.workspace = true
speakeasy-models.workspace = true
speakeasy-delivery.workspace = true
speakeasy-storage.workspace = true
speakeasy-transforms.workspace = true
speakeasy-windows.workspace = true
tauri.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-single-instance.workspace = true

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
