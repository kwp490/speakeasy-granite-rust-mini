[package]
name = "speakeasy-bootstrapper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The first thing a user double-clicks, and the thing they fall back to when the
# app is broken. It absorbed `speakeasy-repair`, so the dependency set below is
# still that tool's — setup's own needs (hardware probing, downloads, the native
# wizard) arrive with the stages that use them, rather than being declared ahead
# of any code that justifies them.
[dependencies]
# `CancelToken`, and nothing else. It is what `download_to_file` and
# `InstallManager` take to be interruptible, so the alternative to this line is
# reimplementing durable resume inside setup, which is a regression rather than
# an option. This crate has no dependencies of its own and is already in the
# graph beneath `speakeasy-models`.
speakeasy-domain.workspace = true
# The hardware and GPU probes, the pinned manifest the weights figures are read
# from, and the download/install lifecycle setup fetches models with. Reused
# rather than reimplemented: `admit_engines` already draws the
# admissible/qualified line that setup's copy depends on, and `download_to_file`
# already owns the validator-bound `.partial` resume that setup must not fake.
speakeasy-models.workspace = true
speakeasy-storage.workspace = true
speakeasy-windows.workspace = true
# The install-decision half of what NSIS used to do: `semver` for the version
# comparison its `${VersionCompare}` performed, `winreg` for the stamp it read
# and wrote, `sysinfo` for the running-app refusal.
semver.workspace = true
sysinfo.workspace = true
winreg.workspace = true
# The payload appended to setup's own executable is verified entry by entry
# before a byte of it is written. Not against tampering — the whole file is
# untrusted until the user runs it — but against a truncated download, which
# leaves a setup file that still launches because the missing part lies past the
# end of the PE image. `payload.rs` carries the argument in full.
sha2.workspace = true
# `gui` and `shell` on top of the workspace's `advapi, kernel, user`. The wizard
# is native rather than a Tauri window because the thing that provisions
# WebView2 is the thing this replaces, and repair mode runs on already-broken
# machines. `gui` brings the wizard chrome and `shell` brings IShellLink, which
# is what Start Menu shortcuts need once NSIS is gone. Almost all of it is
# reachable without `unsafe`, which is the property that made a native wizard
# possible at all; the two calls that are not are in `typeface.rs`, under the
# lint table below.
winsafe = { workspace = true, features = ["gui", "shell"] }

# Spelled out rather than `[lints] workspace = true`, and the only crate in the
# workspace that does not inherit. The one difference is `unsafe_code`, which is
# `forbid` at the workspace root and stays there.
#
# Why it has to differ here. `winsafe` sets one process-wide font on every
# control at creation and offers nothing that changes it afterwards; the only way
# is `WM_SETFONT` through `SendMessage`, which `winsafe` marks `unsafe`. So the
# whole setup wizard and the uninstall page drew at the size Windows uses for
# menu bars, which the owner reported as too small to read on 2026-08-26.
# `forbid` cannot be relaxed by an `#[allow]` below it, so the choice was between
# this table, painting every label ourselves, and rebuilding the wizard from an
# `.rc` dialog template. Owner decision, same day; `src/typeface.rs` carries the
# comparison.
#
# `deny`, not `allow`: every `unsafe` block in this crate needs its own
# `#[allow(unsafe_code)]` with a `SAFETY:` note, and there are exactly two, both
# in `typeface.rs`. And the root stays `forbid` deliberately, because it is
# load-bearing elsewhere for more than style — under edition 2024 it is what
# makes `std::env::set_var` unreachable from a test, which is why
# `speakeasy-storage` resolves its directory through a parameter instead.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
